name: Reference models

# Imports the real pinned models (SmolLM2-135M-Instruct, Qwen2.5-0.5B/1.5B-Instruct, Qwen3-0.6B, TinyLlama-1.1B-Chat,
# OLMo-2-1B-Instruct, the gated Llama-3.2-1B-Instruct and gemma-3-270m-it, the embedding model Qwen3-Embedding-0.6B and the encoders all-MiniLM-L6-v2, bge-small-en-v1.5, all-distilroberta-v1 and paraphrase-multilingual-MiniLM-L12-v2 and the cross-encoders ms-marco-MiniLM-L6-v2 and mmarco-mMiniLMv2-L12-H384-v1) and compares tokenizer, chat template, logits and greedy generation with Hugging Face transformers; pins our
# outputs as golden hashes.
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    env:
      DLLM_REFERENCE_MODELS: ${{ github.workspace }}/.reference-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install with the reference implementation (CPU torch)
        run: pip install ".[dev,reference]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Cache the pinned model snapshots
        uses: actions/cache@v4
        with:
          path: .reference-models
          key: reference-models-${{ hashFiles('tests/test_reference_models.py') }}
          restore-keys: reference-models-
      - name: Download the pinned models (skipped for cached files)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}  # gated models (Llama 3.2, Gemma); licences accepted on the Hub
        run: python tests/test_reference_models.py "$DLLM_REFERENCE_MODELS"
      - name: Compare with transformers
        run: pytest tests/test_reference_models.py -v -rs
      - name: Measure Qwen2.5-1.5B (peak memory and speed, float32 and Q8_0)
        if: ${{ !cancelled() }}
        run: |
          snapshot=$(ls -d "$DLLM_REFERENCE_MODELS"/Qwen/Qwen2.5-1.5B-Instruct/*/ | head -1)
          dllm import "$snapshot" -o qwen2.5-1.5b.dllm --repo Qwen/Qwen2.5-1.5B-Instruct --licence Apache-2.0
          ls -l qwen2.5-1.5b.dllm
          for quantize in none q8_0; do
            /usr/bin/time -f "$quantize: peak RSS %M KB, %e s wall" \
              dllm --model qwen2.5-1.5b.dllm --quantize "$quantize" generate --prompt "The capital of France is" --max-tokens 64
          done

  # Phase 10 (#99): the real models' golden bits on every release platform and SIMD path. Needs only the weights.
  portable:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
        isa: [best, portable]
    env:
      DLLM_REFERENCE_MODELS: ${{ github.workspace }}/.reference-models
      DLLM_ISA: ${{ matrix.isa }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install
        run: pip install ".[dev]"
      - name: Cache the pinned model snapshots
        uses: actions/cache@v4
        with:
          path: .reference-models
          key: portable-models-${{ runner.os }}-${{ hashFiles('tests/test_reference_models.py') }}
          restore-keys: portable-models-${{ runner.os }}-
      - name: Download SmolLM2-135M and Qwen2.5-0.5B (skipped for cached files)
        run: python tests/test_reference_models.py "${{ env.DLLM_REFERENCE_MODELS }}" smollm2 qwen2.5
      - name: Golden bits
        run: |
          python -c "from etalii_dllm import numerics; print('instruction set:', numerics.instruction_set())"
          pytest tests/test_reference_models.py -v -rs -k golden
      - name: Against the independent reference implementation (Phase 20)
        shell: bash
        run: |
          snapshot=$(ls -d "$DLLM_REFERENCE_MODELS"/HuggingFaceTB/SmolLM2-135M-Instruct/*/ | head -1)
          dllm import "$snapshot" -o smollm2.dllm --repo HuggingFaceTB/SmolLM2-135M-Instruct --licence Apache-2.0
          dllm --model smollm2.dllm verify --reference
          dllm --model smollm2.dllm --quantize q8_0 verify --reference
          dllm conformance write conformance
          dllm conformance check conformance

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The golden-value tests catch run-to-run drift; the current portable kernels also agree across these platforms.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install (compiles the C++ kernels)
        run: pip install ".[dev]"
      - name: Test
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python == '3.12') }}
        run: pytest -v
      # One job measures coverage; [tool.coverage] in pyproject.toml sets the floor (docs/testing.md).
      - name: Test with coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12' }}
        run: pytest -v --cov --cov-report=term

  # The [cuda] install route without a GPU (runners have none): the extra installs, NVRTC is found and compiles the
  # embedded kernels for every architecture (tests/test_cuda.py). On macOS the extra installs nothing and the backend
  # reports clearly that CUDA is unavailable. Bit-exactness on a real GPU stays with the GPU tests in test_cuda.py.
  cuda-install:
    name: cuda extra (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install with the cuda extra
        run: pip install ".[dev,cuda]"
      - name: Compile the GPU kernels with NVRTC
        env:
          DLLM_REQUIRE_NVRTC: ${{ runner.os != 'macOS' && '1' || '' }}
        run: pytest tests/test_cuda.py -v -rs

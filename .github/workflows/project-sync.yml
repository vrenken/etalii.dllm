name: Project board sync

# Keeps the "EtAlii.Dllm" GitHub Project in step with this repository's issues and milestones.
# Requires the repository secret PROJECT_TOKEN (see docs/project-board.md).
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, milestoned, demilestoned, deleted, transferred]
  push:
    branches: [develop]
    paths:
      - .github/milestones.json
  milestone:
    types: [created, edited, closed, opened, deleted]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/project-sync.yml
      - .github/scripts/sync_project.py
      - .github/scripts/ensure_milestones.py
      - .github/milestones.json

concurrency:
  group: project-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Creates the milestones in .github/milestones.json and files phase-N labelled issues under them. Needs no secret.
  milestones:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: Ensure milestones
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ensure_milestones.py

  sync:
    needs: milestones
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check token
        id: token
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "::warning::PROJECT_TOKEN secret is not set; skipping project sync. See docs/project-board.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync project
        if: steps.token.outputs.present == 'true'
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python3 .github/scripts/sync_project.py

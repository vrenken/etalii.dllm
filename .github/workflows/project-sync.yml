name: Project board sync

# Keeps the "EtAlii.Dllm" GitHub Project in step with this repository's issues and milestones.
# Requires the repository secret PROJECT_TOKEN (see docs/project-board.md).
on:
  issues:
    types: [opened, edited, closed, reopened, milestoned, demilestoned, deleted, transferred]
  milestone:
    types: [created, edited, closed, opened, deleted]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: project-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        id: token
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "::warning::PROJECT_TOKEN secret is not set; skipping project sync. See docs/project-board.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync project
        if: steps.token.outputs.present == 'true'
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python3 .github/scripts/sync_project.py

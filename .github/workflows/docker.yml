name: Docker

# Builds the server image (Dockerfile), checks that it answers identical requests identically and serves the chat
# page, and, when asked to publish, pushes it for linux/amd64 and linux/arm64 to ghcr.io/<owner>/etalii-dllm.
# Releases call this workflow with the version and "latest" (release.yml), every push to develop publishes "edge",
# and a manual run can publish other tags.
on:
  push:
    branches: [develop]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/docker.yml
      - pyproject.toml
      - CMakeLists.txt
  workflow_dispatch:
    inputs:
      tags:
        description: Comma-separated image tags to publish (empty = build and test only)
        type: string
        default: ""
  workflow_call:
    inputs:
      tags:
        type: string
        required: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/etalii-dllm
      TAGS: ${{ inputs.tags || (github.event_name == 'push' && 'edge') || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t etalii-dllm:ci .
      - name: Smoke test
        run: |
          docker run -d --name dllm -p 5080:5080 etalii-dllm:ci
          for i in $(seq 30); do curl -sf http://localhost:5080/v1/models && break; sleep 1; done
          request='{"messages":[{"role":"user","content":"Hello"}],"temperature":0.8,"seed":7,"max_tokens":16}'
          first=$(curl -sf http://localhost:5080/v1/chat/completions -H 'Content-Type: application/json' -d "$request")
          second=$(curl -sf http://localhost:5080/v1/chat/completions -H 'Content-Type: application/json' -d "$request")
          echo "$first"
          test -n "$first" && test "$first" = "$second"
          curl -sf http://localhost:5080/ | grep -q "<title>EtAlii.Dllm chat</title>"
          docker logs dllm
          docker rm -f dllm
      - name: Publish
        if: env.TAGS != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --use
          args=()
          for tag in ${TAGS//,/ }; do args+=(--tag "$IMAGE:$tag"); done
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" "${args[@]}" .

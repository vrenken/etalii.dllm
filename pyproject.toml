[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "etalii-dllm"
# The version lives in src/etalii_dllm/__init__.py (see [tool.scikit-build.metadata.version]).
dynamic = ["version"]
description = "A deterministic large language model: same hardware and same prompt give the same output."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Peter Vrenken" }]
dependencies = [
  "numpy>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mcp>=2.0,<3",
  "regex>=2024.4",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9",  # file uploads of the Files API (/v1/files)
]

[project.optional-dependencies]
# gguf, safetensors and tokenizers are the reference implementations the import and tokenizer tests compare against.
# openai, anthropic and ollama are the official clients the API tests drive the server with; jsonschema checks
# structured output.
dev = [
  "pytest>=8", "httpx>=0.27", "ruff>=0.6", "gguf>=0.17", "safetensors>=0.4", "tokenizers>=0.20",
  "openai>=1.60", "anthropic>=0.60", "ollama>=0.6", "jsonschema>=4.20", "pytest-cov>=5", "cryptography>=42",
]
# Ed25519 signatures for receipts, transcripts and model files (dllm sign, --sign-key, --trust).
sign = ["cryptography>=42"]
# NVRTC, the CUDA runtime compiler the GPU backend needs (--device cuda); the NVIDIA driver provides the rest.
# There is no CUDA on macOS, so there the extra installs nothing.
cuda = ["nvidia-cuda-nvrtc-cu12>=12.1; sys_platform != 'darwin'"]
# Hugging Face transformers as the reference the imported models are compared with (tests/test_reference_models.py).
reference = ["torch>=2.4", "transformers>=4.50", "peft>=0.13"]

[project.scripts]
dllm = "etalii_dllm.cli:main"
dllm-server = "etalii_dllm.server.app:main"
dllm-mcp = "etalii_dllm.mcp_server:main"
dllm-tools = "etalii_dllm.builtin_tools:main"

[project.urls]
Repository = "https://github.com/vrenken/etalii.dllm"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/etalii_dllm"]
sdist.exclude = [".claude", ".github", ".venv", "build"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/etalii_dllm/__init__.py"

# Release wheels (.github/workflows/release.yml, docs/releasing.md). Every wheel is installed in a fresh environment
# and the whole test suite, golden hashes included, runs against it.
[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp313-*"]
skip = ["*-musllinux_*"]
# 64-bit only (no win32 or i686): the dev dependencies used by the tests have no 32-bit wheels.
archs = ["auto64"]
test-extras = ["dev"]
test-sources = ["tests"]
test-command = "pytest tests -q -p no:cacheprovider"

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Coverage (docs/testing.md): CI measures it on one Linux job and fails below the floor. The GPU code only runs on a
# machine with an NVIDIA GPU, which CI does not have, so it counts as missed there.
[tool.coverage.run]
source_pkgs = ["etalii_dllm"]
branch = true

[tool.coverage.report]
fail_under = 96
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

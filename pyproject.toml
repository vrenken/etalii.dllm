[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "etalii-dllm"
version = "0.1.0"
description = "A deterministic large language model: same hardware and same prompt give the same output."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Peter Vrenken" }]
dependencies = [
  "numpy>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
# gguf and safetensors are the reference implementations the importer tests compare against.
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "gguf>=0.17", "safetensors>=0.4"]

[project.scripts]
dllm = "etalii_dllm.cli:main"
dllm-server = "etalii_dllm.server.app:main"
dllm-mcp = "etalii_dllm.mcp_server:main"

[project.urls]
Repository = "https://github.com/vrenken/etalii.dllm"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/etalii_dllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
